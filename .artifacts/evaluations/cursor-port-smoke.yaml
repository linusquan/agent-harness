criteria:
  specConformance:
    score: 10
    maxScore: 10
    findings: |
      Every step of both plan phases is implemented, and all seven of the plan's
      own verification items were re-checked independently and pass.

      Phase 1: `.artifacts/` exists; `.artifacts/VERIFY.md` was created with a
      top-level `# Cursor Port Smoke Test` heading plus two lines of placeholder
      copy identifying it as a stub for the Cursor port of the plan -> build ->
      check harness (240 bytes). Step 1.3's negative requirement holds: no `src/`
      directory exists, `.gitignore` is byte-identical to HEAD (`git diff HEAD
      -- .gitignore` empty), and nothing under `.cursor/` or `.claude/` moved.

      Phase 2: `.artifacts/buildlog/cursor-port-smoke.yaml` exists and parses as
      YAML. `commitHash` and `commitMessage` are both explicitly `null` rather
      than a fabricated hash, and `notes` states the reason (the deliverable is
      gitignored). The Playwright-not-applicable skip is recorded as Step 2.3
      required. `git status --short` is empty.

      The plan's most important constraint -- scope fenced to `.artifacts/` only
      -- is fully respected. `git status --short --ignored` shows `!! .artifacts/`
      as the sole entry, and `git ls-files --others --exclude-standard` is empty,
      so the build created no untracked non-ignored files anywhere in the repo.
      The two documented over-delivery risks (scaffolding `src/`, or force-adding
      the ignored file / editing `.gitignore`) both did not occur.

      The file sits directly at `.artifacts/VERIFY.md` and not nested deeper; a
      `find .artifacts -name VERIFY.md` returns exactly one path.
    issues: []

  functionalCompleteness:
    score: 9
    maxScore: 10
    findings: |
      Playwright MCP was not available in this environment (no Playwright
      namespace; the Browser-use MCP server failed live tool discovery), and the
      task has no application UI in scope -- there is no `package.json`, no dev
      server, and no `src/` tree. Rather than declare functional testing
      inapplicable, testing was done two ways: filesystem/git-level assertions,
      and through the repo's own `scripts/artifact-browser.js` HTTP server, which
      serves `.artifacts/` and is the only real consumer of this deliverable. The
      server was started on port 28080, exercised, then shut down; the working
      tree was re-confirmed clean afterwards.

      Happy path and all edge/error cases pass. The stub is discoverable in the
      served tree listing alongside `plans/` and `buildlog/`, and its full
      content renders correctly through the file endpoint including the unicode
      arrow. The one point withheld reflects evidence modality -- verification is
      HTTP- and filesystem-level rather than a rendered browser flow -- not any
      observed defect in the build.
    tests:
      - id: "FT-01"
        type: happy-path
        description: ".artifacts/VERIFY.md exists, is non-empty (240 bytes), opens as valid Markdown with a level-1 heading on line 1, and sits directly under .artifacts/"
        result: pass
      - id: "FT-02"
        type: happy-path
        description: "Artifact browser served the stub: GET /api/tree lists VERIFY.md at the root alongside buildlog/ and plans/, and GET /api/file?path=VERIFY.md returns the full stub text intact"
        result: pass
      - id: "FT-03"
        type: happy-path
        description: "Build log parses as YAML with all nine expected top-level keys (feature, description, filesChanged, mainImplementationStrategy, assumptionsMade, testsPerformed, commitHash, commitMessage, notes)"
        result: pass
      - id: "FT-04"
        type: edge-case
        description: "git status --short is empty and git diff HEAD --stat is empty -- no tracked file changed and the stub never became stageable"
        result: pass
      - id: "FT-05"
        type: edge-case
        description: "git check-ignore -v .artifacts/VERIFY.md still reports .gitignore:10:.artifacts/, confirming the ignore rule was not subverted"
        result: pass
      - id: "FT-06"
        type: edge-case
        description: "Scope fence: no src/ directory created, .gitignore unchanged vs HEAD, and git ls-files --others --exclude-standard returns nothing"
        result: pass
      - id: "FT-07"
        type: error-handling
        description: "git add --dry-run .artifacts/VERIFY.md is rejected with exit 1 and the ignored-path hint, and the index is unchanged afterwards -- the file cannot be accidentally staged"
        result: pass
      - id: "FT-08"
        type: error-handling
        description: "Artifact browser error paths behave with the stub in place: traversal attempt (path=../.gitignore) returns 403, nonexistent file returns 404, missing path param returns 400"
        result: pass

  codeQuality:
    score: 9
    maxScore: 10
    findings: |
      The deliverable is four lines of Markdown, and it is the right four lines:
      a descriptive H1, one sentence saying what the file is, one sentence saying
      why it exists. Wording matches the plan's "short, human-readable
      placeholder content that states what the file is for" and matches the
