  buildLogAccuracy:
    score: 10
    maxScore: 10
    findings: |
      The build log matches reality on every checkable claim.

      filesChanged lists exactly one entry, `.artifacts/VERIFY.md` with
      `action: created`, and its summary ("heading and two lines") matches the
